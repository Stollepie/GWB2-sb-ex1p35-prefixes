<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Negative Prefixes · Word Sort</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif;color:#253047;background:#f7f8fc}*{box-sizing:border-box}body{margin:0}main{max-width:1250px;margin:auto;padding:20px 15px 55px}h1{font-size:clamp(25px,4vw,38px);margin:0 0 5px;letter-spacing:-1px}p{color:#657086;margin:5px 0 17px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid #dbe0eb;border-radius:13px;padding:11px 15px;background:white;color:#253047;font-weight:700;cursor:pointer}.progress{font-weight:800;color:#6a55c8}.bank{background:#fff;border:1px solid #e5e6ef;border-radius:22px;padding:17px;margin:17px 0;box-shadow:0 6px 25px #25304708}.bankhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:13px;font-weight:800}.words{display:flex;flex-wrap:wrap;gap:9px;min-height:55px}.word{border:1px solid #ded9ef;background:#f4efff;color:#493b83;border-radius:11px;padding:11px 13px;font-size:15px;font-weight:700;cursor:grab;touch-action:manipulation;user-select:none;transition:transform .18s,background .18s}.word.selected{background:#6d5cc5;color:white;border-color:#6d5cc5;box-shadow:0 0 0 3px #c7bafa}.word.error{background:#ffe0e3;color:#c62c4b;border-color:#e9657c;animation:shake .36s}.word:active{cursor:grabbing}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.column{border:2px dashed #d7dbe9;background:#fff;border-radius:17px;min-height:220px;padding:10px;transition:background .2s,border-color .2s}.column.over{border-color:#7d66df;background:#f1edff}.column.error{border-color:#e74e6a;background:#fff0f2;animation:shake .36s}.prefix{text-align:center;font-size:clamp(23px,3vw,35px);font-weight:900;letter-spacing:-1px;padding:9px 0 13px}.column:nth-child(1) .prefix{color:#b2529e}.column:nth-child(2) .prefix{color:#497fba}.column:nth-child(3) .prefix{color:#ce7948}.column:nth-child(4) .prefix{color:#3e9c80}.column:nth-child(5) .prefix{color:#9861bd}.column:nth-child(6) .prefix{color:#bd6572}.placed{background:#eef9f2;color:#226d4b;border-radius:9px;padding:9px 5px;margin:6px 0;text-align:center;font-weight:700;overflow-wrap:anywhere;font-size:clamp(12px,1.25vw,15px);animation:pop .22s}.hint{font-size:12px;color:#8b91a3;text-align:center;padding:9px 0}.status{min-height:24px;font-size:14px;font-weight:700;color:#6c58ba}.done{padding:16px;border-radius:16px;background:#e9f8ee;color:#247149;margin-top:14px;font-weight:800;text-align:center}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}@keyframes pop{from{transform:scale(.9);opacity:.4}to{transform:scale(1);opacity:1}}@media(max-width:850px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}.column{min-height:160px}.placed{font-size:13px}}@media(max-width:450px){main{padding:15px 10px 35px}.board{gap:7px}.column{padding:6px;min-height:140px;border-radius:13px}.prefix{padding:8px 0;font-size:26px}.word{padding:10px 11px;font-size:14px}.bank{padding:12px}.placed{font-size:12px;padding:8px 3px}}
</style></head><body><main><div class="top"><div><h1>Negative Prefixes</h1><p>Drag a word into the correct prefix column, or tap a word and then tap a column.</p></div><div class="actions"><span class="progress" id="progress">0 / 29</span><button class="btn" id="reset">↻ Restart</button></div></div><section class="bank"><div class="bankhead"><span>Word bank</span><span class="status" id="status" aria-live="polite"></span></div><div class="words" id="words"></div></section><section class="board" id="board"></section><div id="finish" aria-live="polite"></div></main><script>
const entries=[['advantage','dis'],['agree','dis'],['believable','un'],['capable','in'],['comfort','dis'],['complete','in'],['correct','in'],['employed','un'],['expected','un'],['experienced','in'],['inspiring','un'],['legal','il'],['likely','un'],['logical','il'],['mature','im'],['necessary','un'],['obey','dis'],['patient','im'],['possible','im'],['practical','im'],['predictable','un'],['probable','im'],['regular','ir'],['relevant','ir'],['reliable','un'],['responsible','ir'],['secure','in'],['successful','un'],['usual','un']];const prefixes=['dis','il','im','in','ir','un'];let remaining=[],selected=null,dragging=null;const words=document.getElementById('words'),board=document.getElementById('board'),status=document.getElementById('status');function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function restart(){remaining=shuffle(entries.map(([word,prefix])=>({word,prefix})));selected=null;dragging=null;board.innerHTML='';words.innerHTML='';status.textContent='';document.getElementById('finish').innerHTML='';prefixes.forEach(p=>{let c=document.createElement('div');c.className='column';c.dataset.prefix=p;c.innerHTML=`<div class="prefix">${p}-</div><div class="hint">Drop here</div><div class="items"></div>`;c.addEventListener('click',()=>{if(selected)attempt(selected,p,c)});c.addEventListener('dragover',e=>{e.preventDefault();c.classList.add('over')});c.addEventListener('dragleave',()=>c.classList.remove('over'));c.addEventListener('drop',e=>{e.preventDefault();c.classList.remove('over');if(dragging)attempt(dragging,p,c)});board.append(c)});remaining.forEach(item=>{let el=document.createElement('button');el.type='button';el.className='word';el.textContent=item.word;el.draggable=true;el.dataset.word=item.word;el.addEventListener('click',()=>{document.querySelectorAll('.word').forEach(x=>x.classList.remove('selected'));if(selected===item){selected=null;status.textContent=''}else{selected=item;el.classList.add('selected');status.textContent='Choose a prefix below'}});el.addEventListener('dragstart',e=>{dragging=item;e.dataTransfer.setData('text/plain',item.word);e.dataTransfer.effectAllowed='move'});el.addEventListener('dragend',()=>dragging=null);words.append(el)});update()}function attempt(item,p,c){let el=[...words.children].find(x=>x.dataset.word===item.word);if(!el)return;if(item.prefix===p){let made=document.createElement('div');made.className='placed';made.textContent=p+item.word;c.querySelector('.items').append(made);c.querySelector('.hint').style.display='none';el.remove();remaining=remaining.filter(x=>x!==item);selected=null;dragging=null;status.textContent='Correct!';update();if(!remaining.length)document.getElementById('finish').innerHTML='<div class="done">Excellent! You sorted all 29 words correctly.</div>'}else{el.classList.remove('error');c.classList.remove('error');void el.offsetWidth;el.classList.add('error');c.classList.add('error');status.textContent='Not quite — try another prefix';setTimeout(()=>{el.classList.remove('error');c.classList.remove('error')},500)}}function update(){document.getElementById('progress').textContent=(entries.length-remaining.length)+' / '+entries.length}document.getElementById('reset').onclick=restart;restart();</script></body></html>
